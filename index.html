<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesLog Royal | Philo fries</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary-gold: #d4af37; --dark-bg: #0f172a;
            --glass-bg: rgba(15, 23, 42, 0.85); --glass-border: rgba(255, 255, 255, 0.1);
            --text-light: #f8fafc; --success: #10b981; --danger: #ef4444; --accent: #3b82f6; --whatsapp: #25D366;
        }

        .dark-mode {
            --dark-bg: #000000; --glass-bg: rgba(20, 20, 20, 0.95);
            --text-light: #e2e8f0; --glass-border: rgba(212, 175, 55, 0.2);
        }

        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;
            background: var(--dark-bg); background-size: cover; background-position: center;
            background-attachment: fixed; color: var(--text-light); transition: 0.3s;
            display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden;
        }

        /* هيدر ملكي فخم */
        header {
            position: sticky; top: 0; z-index: 1000;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
            backdrop-filter: blur(15px); padding: 12px 25px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--primary-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo-box h1 { margin: 0; font-size: 22px; color: var(--primary-gold); font-weight: 900; }
        
        .status-lamp { display: flex; align-items: center; gap: 6px; font-size: 10px; background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 15px; border: 1px solid var(--glass-border); }
        .lamp { width: 8px; height: 8px; border-radius: 50%; }
        .online { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .offline { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

        .clock-frame { font-family: 'Courier New', monospace; font-weight: bold; font-size: 16px; color: var(--primary-gold); background: rgba(0,0,0,0.2); padding: 4px 12px; border-radius: 10px; border: 1px solid var(--primary-gold); }

        /* شاشة الدخول */
        #loginOverlay { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-card { background: #1e293b; padding: 40px; border-radius: 20px; border: 1px solid var(--primary-gold); text-align: center; width: 300px; }
        .login-card h1 { color: var(--primary-gold); margin-bottom: 20px; }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #444; background: #000; color: #fff; text-align: center; font-size: 18px; }

        /* نافذة باسوورد العمليات */
        #verifyOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 10000; }
        .verify-card { background: #1e293b; padding: 30px; border-radius: 20px; border: 1px solid var(--accent); text-align: center; width: 280px; }
        .verify-card input { width: 100%; padding: 12px; margin-bottom: 20px; background:#000; color:#fff; border-radius:10px; text-align:center; border:1px solid var(--primary-gold); }

        #mainContent { display: none; width: 96%; max-width: 1400px; margin: 20px auto; flex: 1; }

        .toolbar { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; color: #fff; font-size: 13px; display: flex; align-items: center; gap: 5px; transition: 0.3s; }
        .btn-add { background: var(--success); } .btn-archive { background: var(--accent); } .btn-user { background: var(--primary-gold); color: #000; }
        .btn-wa { background: var(--whatsapp); margin-left: 25px !important; } /* إبعاد الواتس عن الحذف */

        .table-wrapper { background: var(--glass-bg); border-radius: 20px; border: 1px solid var(--glass-border); overflow-x: auto; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        th { padding: 18px; color: var(--primary-gold); border-bottom: 2px solid var(--glass-border); font-size: 13px; }
        td { padding: 10px; border-bottom: 1px solid var(--glass-border); text-align: center; }
        
        .table-input { background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 10px; border-radius: 8px; color: #fff; text-align: center; width: 90%; outline: none; font-family: Arial; }
        .table-input:read-only { opacity: 0.5; cursor: not-allowed; }
        .table-input::placeholder { color: rgba(255,255,255,0.1); }

        .tab-nav { margin-bottom: 20px; display: flex; gap: 10px; justify-content: center; }
        .t-btn { padding: 12px 25px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; color: #94a3b8; cursor: pointer; transition: 0.3s; }
        .t-btn.active { background: var(--primary-gold); color: #000; font-weight: bold; }

        footer { padding: 30px; text-align: center; background: rgba(0,0,0,0.3); border-top: 1px solid var(--glass-border); color: #64748b; font-weight: bold; }

        @media print { .no-print { display: none !important; } body { background: #fff !important; color: #000; } }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h1>SalesLog</h1>
        <p style="color:var(--primary-gold)">الملكية Philo fries</p>
        <input type="password" id="passInput" placeholder="Password">
        <button class="btn btn-user" onclick="checkPass()" style="width:100%; justify-content: center;">دخول</button>
    </div>
</div>

<div id="verifyOverlay">
    <div class="verify-card">
        <h3 style="color:var(--primary-gold)">إذن العمليات</h3>
        <input type="password" id="actionPassInp" placeholder="أدخل الرقم السري">
        <div style="display:flex; gap:10px;">
            <button class="btn btn-add" onclick="confirmUnlock()" style="flex:1; justify-content:center">فتح</button>
            <button class="btn" onclick="closeVerify()" style="flex:1; justify-content:center; background:#444">إلغاء</button>
        </div>
    </div>
</div>

<header class="no-print">
    <div class="header-left">
        <div class="logo-box"><h1>Philo fries 🍟</h1></div>
        <div id="connStatus" class="status-lamp">
            <span id="statusDot" class="lamp online"></span>
            <span id="statusText">متصل</span>
        </div>
    </div>
    <div class="clock-frame" id="liveClock">00:00:00</div>
    <div style="display:flex; gap:10px; align-items:center;">
        <button class="btn" style="background:rgba(255,255,255,0.1); padding:8px;" onclick="toggleDarkMode()">🌓</button>
        <button class="btn btn-user" style="font-size:10px; padding:8px;" onclick="document.getElementById('bgInp').click()">🖼 الخلفية</button>
        <input type="file" id="bgInp" hidden accept="image/*" onchange="changeBg(this)">
    </div>
</header>

<div id="mainContent">
    <div class="toolbar no-print">
        <button class="btn btn-lock" id="lockBtn" style="background:#475569" onclick="openVerify()">🔒 وضع التعديل</button>
        <button class="btn btn-add" onclick="addNewOrder()">➕ عميل جديد</button>
        <button class="btn btn-archive" onclick="archiveToday()">📦 تقفيل اليوم</button>
        <button class="btn btn-user" onclick="doPrint('customer')">📄 فاتورة عميل</button>
        <button class="btn btn-user" style="background:#475569" onclick="doPrint('user')">📊 تقرير إدارة</button>
    </div>

    <div class="tab-nav no-print">
        <button class="t-btn active" id="tab-today" onclick="showTab('today')">مبيعات اليوم</button>
        <button class="t-btn" id="tab-history" onclick="showTab('history'); loadHistoryList()">الأرشيف</button>
        <button class="t-btn" id="tab-master" onclick="showTab('master'); loadMasterLog()">السجل الشامل</button>
    </div>

    <div id="todaySection" class="tab-section" style="display:block">
        <div style="margin-bottom: 15px; font-weight:bold;">
            💰 تكلفة الوحدة: <input type="number" id="costPerUnit" class="table-input" style="width: 100px;" placeholder="0" oninput="updateCost(this.value)">
        </div>
        <div class="table-wrapper">
            <table id="salesTable">
                <thead>
                    <tr><th>الوقت</th><th>اسم العميل</th><th>الموبايل</th><th>نوع المنتج</th><th>الكمية</th><th>سعر البيع</th><th>الإجمالي</th><th>المكسب</th><th class="no-print">إجراء</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="historySection" class="tab-section" style="display:none"><div id="historyList"></div></div>
    <div id="masterSection" class="tab-section" style="display:none">
        <div class="table-wrapper">
            <table><thead><tr><th>التاريخ</th><th>العميل</th><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th>المكسب</th><th class="no-print">حذف نهائي</th></tr></thead><tbody id="masterBody"></tbody></table>
        </div>
    </div>
</div>

<footer>elgokar | للتواصل واتس 01126511633 | <span style="color:var(--danger)">yola❤</span></footer>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAHoQSf3qtH_DaQIRVgvu3rKJr fBB24P38",
        authDomain: "sales-log-41275.firebaseapp.com",
        databaseURL: "https://sales-log-41275-default-rtdb.firebaseio.com",
        projectId: "sales-log-41275",
        storageBucket: "sales-log-41275.firebasestorage.app",
        messagingSenderId: "88781897193",
        appId: "1:88781897193:web:0abd3be343074cea38df78"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let isAdmin = false; let isTyping = false; let archID = null;

    window.addEventListener('online', () => { document.getElementById('statusDot').className = 'lamp online'; db.goOnline(); });
    window.addEventListener('offline', () => { document.getElementById('statusDot').className = 'lamp offline'; db.goOffline(); });

    function checkPass() {
        if(document.getElementById("passInput").value === "25446" || sessionStorage.getItem("logged") === "true") {
            document.getElementById("loginOverlay").style.display = "none";
            document.getElementById("mainContent").style.display = "block";
            sessionStorage.setItem("logged", "true");
            startSync();
        } else { alert("خطأ!"); }
    }
    if(sessionStorage.getItem("logged") === "true") checkPass();

    function openVerify() { document.getElementById("verifyOverlay").style.display = "flex"; }
    function closeVerify() { document.getElementById("verifyOverlay").style.display = "none"; }
    function confirmUnlock() {
        if(document.getElementById("actionPassInp").value === "254468300") {
            isAdmin = true; document.getElementById("lockBtn").innerText = "🔓 وضع التعديل مفتوح";
            document.getElementById("lockBtn").style.background = "var(--success)";
            closeVerify(); startSync();
        } else { alert("خطأ!"); }
    }

    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

    function startSync() {
        db.ref('currentDay').on('value', (snap) => {
            if(isTyping) return;
            const data = snap.val() || { cost:0, sales:[] };
            document.getElementById("costPerUnit").value = data.cost || "";
            renderTable(data.sales || []);
        });
        let savedBg = localStorage.getItem("royal_bg");
        if(savedBg) document.body.style.backgroundImage = `url(${savedBg})`;
    }

    function renderTable(sales) {
        const tbody = document.querySelector("#salesTable tbody");
        tbody.innerHTML = "";
        sales.forEach((s, i) => {
            if(s.isCanceled && archID) return;
            let q = parseFloat(s.qty)||0; let p = parseFloat(s.price)||0;
            let rt = q * p; let rp = (p - parseFloat(document.getElementById("costPerUnit").value||0)) * q;
            let row = tbody.insertRow();
            row.innerHTML = `
                <td><input class="table-input" value="${s.time}" readonly style="border:none; width:70px"></td>
                <td><input class="table-input" value="${s.name||''}" ${!isAdmin?'readonly':''} onfocus="isTyping=true" onblur="isTyping=false" oninput="updateSale(${i},'name',this.value)"></td>
                <td><input class="table-input" value="${s.phone||''}" ${!isAdmin?'readonly':''} onfocus="isTyping=true" onblur="isTyping=false" oninput="updateSale(${i},'phone',this.value)"></td>
                <td><input class="table-input" value="${s.product||''}" ${!isAdmin?'readonly':''} onfocus="isTyping=true" onblur="isTyping=false" oninput="updateSale(${i},'product',this.value)"></td>
                <td><input class="table-input" type="number" value="${s.qty||''}" placeholder="0" ${!isAdmin?'readonly':''} onfocus="isTyping=true" onblur="isTyping=false" oninput="updateSale(${i},'qty',this.value)"></td>
                <td><input class="table-input" type="number" value="${s.price||''}" placeholder="0" ${!isAdmin?'readonly':''} onfocus="isTyping=true" onblur="isTyping=false" oninput="updateSale(${i},'price',this.value)"></td>
                <td style="color:var(--primary-gold); font-weight:bold;">${rt.toLocaleString()}</td>
                <td style="color:var(--success); font-weight:bold;">${rp.toLocaleString()}</td>
                <td class="no-print">
                    <button class="btn btn-wa" onclick="goWA(${i})">💬 شات</button>
                    <button class="btn" style="padding:5px; background:var(--danger); display:inline-block;" onclick="deleteSale(${i})">❌</button>
                </td>
            `;
        });
    }

    // شات العميل مباشرة بدون رسائل
    function goWA(i) {
        let ref = archID ? `history/${archID}/sales/${i}` : `currentDay/sales/${i}`;
        db.ref(ref).once('value', (snap) => {
            const s = snap.val(); if(!s.phone) return alert("أدخل رقم الموبايل");
            window.open(`https://wa.me/20${s.phone}`, '_blank');
        });
    }

    function updateSale(i, f, v) { if(!isAdmin) return; let r = archID ? `history/${archID}/sales/${i}` : `currentDay/sales/${i}`; db.ref(r).child(f).set(v); calculateLocally(); }
    function updateCost(v) { if(!isAdmin) return; let r = archID ? `history/${archID}/cost` : `currentDay/cost`; db.ref(r).set(v); calculateLocally(); }
    function calculateLocally() { 
        let cost = parseFloat(document.getElementById("costPerUnit").value) || 0;
        document.querySelectorAll("#salesTable tbody tr").forEach(row => {
            let q = parseFloat(row.cells[4].querySelector('input').value) || 0;
            let p = parseFloat(row.cells[5].querySelector('input').value) || 0;
            row.cells[6].innerText = (q * p).toLocaleString();
            row.cells[7].innerText = ((p - cost) * q).toLocaleString();
        });
    }

    function addNewOrder() { if(!isAdmin) return alert("افتح التعديل"); let r = archID ? `history/${archID}/sales` : `currentDay/sales`; db.ref(r).once('value', snap => { let s = snap.val() || []; s.push({time: new Date().toLocaleTimeString('en-US',{hour12:false, hour:'2-digit', minute:'2-digit'}), name:"", phone:"", product:"", qty:"", price:""}); db.ref(r).set(s); }); }
    function deleteSale(i) { if(!isAdmin) return alert("افتح التعديل"); if(confirm("مسح؟")) { isTyping = false; let r = archID ? `history/${archID}/sales` : 'currentDay/sales'; db.ref(r).once('value', snap => { let s = snap.val(); s.splice(i, 1); db.ref(r).set(s); }); } }

    function archiveToday() {
        if(!isAdmin) return alert("افتح التعديل"); if(!confirm("ترحيل؟")) return;
        db.ref('currentDay').once('value', snap => {
            const d = snap.val(); db.ref('history').push({ date: new Date().toLocaleString('ar-EG'), cost: d.cost, sales: d.sales });
            db.ref('currentDay/sales').set([]); alert("تم الترحيل");
        });
    }

    function loadHistoryList() { db.ref('history').on('value', snap => { const list = document.getElementById("historyList"); list.innerHTML = ""; const d = snap.val(); if(!d) return; Object.keys(d).reverse().forEach(id => { let div = document.createElement("div"); div.style = "background:var(--glass-bg); padding:15px; border-radius:15px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border:1px solid var(--glass-border);"; div.innerHTML = `<strong>🗓️ ${d[id].date}</strong> <div><button class="btn btn-user" onclick="viewHist('${id}')">فتح</button></div>`; list.appendChild(div); }); }); }
    function viewHist(id) { archID = id; db.ref(`history/${id}`).on('value', snap => { const e = snap.val(); if(!e) return; document.getElementById("costPerUnit").value = e.cost; renderTable(e.sales || []); showTab('today'); }); }

    function loadMasterLog() {
        const b = document.getElementById("masterBody"); b.innerHTML = "";
        db.ref().once('value', snap => {
            const a = snap.val(); if(!a || !a.history) return;
            Object.keys(a.history).reverse().forEach(dayKey => {
                let h = a.history[dayKey];
                if(h.sales) h.sales.forEach((s, sIdx) => {
                    let rt = (parseFloat(s.qty)||0) * (parseFloat(s.price)||0);
                    let row = b.insertRow();
                    row.innerHTML = `<td>${h.date}</td><td>${s.name}</td><td>${s.product}</td><td>${s.qty}</td><td>${s.price}</td><td>${rt.toLocaleString()}</td><td>-</td>
                    <td><button class="btn" style="background:var(--danger); padding:5px" onclick="masterDel('${dayKey}',${sIdx})">❌ حذف</button></td>`;
                });
            });
        });
    }

    function masterDel(dk, si) { if(!isAdmin) return alert("افتح التعديل"); if(confirm("حذف نهائي؟")) db.ref(`history/${dk}/sales`).once('value', snap => { let s = snap.val(); s.splice(si, 1); db.ref(`history/${dk}/sales`).set(s).then(() => loadMasterLog()); }); }

    function doPrint(m) {
        let rows = document.querySelectorAll("#salesTable tbody tr");
        let win = window.open('', '', 'height=700,width=1000');
        let html = `<html><head><style>body{direction:rtl; font-family:sans-serif; padding:40px; text-align:center;} table{width:100%; border-collapse:collapse; margin:20px 0;} th,td{border:1px solid #000; padding:10px; text-align:center;} th{background:#eee;}</style></head><body>`;
        html += `<h2>فاتورة Philo fries 🍟</h2><table><thead><tr><th>العميل</th><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th>`;
        if(m==='user') html += `<th>المكسب</th>`;
        html += `</tr></thead><tbody>`;
        rows.forEach(r => {
            let n=r.cells[1].querySelector('input').value; let pr=r.cells[3].querySelector('input').value; let q=r.cells[4].querySelector('input').value; let p=r.cells[5].querySelector('input').value;
            if(n||q){ html+=`<tr><td>${n}</td><td>${pr}</td><td>${q}</td><td>${p}</td><td>${r.cells[6].innerText}</td>`; if(m==='user') html+=`<td>${r.cells[7].innerText}</td>`; html+=`</tr>`;}
        });
        html += `</tbody></table><img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://wa.me/201126511633"><p>Philo fries ✨</p></body></html>`;
        win.document.write(html); win.document.close(); setTimeout(()=>win.print(), 500);
    }

    function showTab(t) { if(t !== 'today') archID = null; document.querySelectorAll('.tab-section').forEach(s => s.style.display = 'none'); document.getElementById(t + 'Section').style.display = 'block'; document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('active')); document.getElementById('tab-' + t).classList.add('active'); }
    function changeBg(i) { if (i.files && i.files[0]) { let r = new FileReader(); r.onload = (e) => { document.body.style.backgroundImage = `url(${e.target.result})`; localStorage.setItem("royal_bg", e.target.result); }; r.readAsDataURL(i.files[0]); } }
    setInterval(()=> { document.getElementById('liveClock').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
