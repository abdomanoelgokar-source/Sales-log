<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesLog Royal | Philo fries</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary-gold: #d4af37; --dark-bg: #0f172a;
            --glass-bg: rgba(15, 23, 42, 0.85); --glass-border: rgba(255, 255, 255, 0.1);
            --text-light: #f8fafc; --success: #10b981; --danger: #ef4444; --accent: #3b82f6; --whatsapp: #25D366;
        }

        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            background-size: cover; background-position: center; background-attachment: fixed;
            color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
        }

        #loginOverlay { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-card { background: #1e293b; padding: 40px; border-radius: 20px; border: 1px solid var(--primary-gold); text-align: center; width: 300px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #444; background: #000; color: #fff; text-align: center; font-size: 18px; }

        #verifyOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 10000; }
        .verify-card { background: #1e293b; padding: 30px; border-radius: 20px; border: 1px solid var(--accent); text-align: center; width: 280px; }

        #mainContent { display: none; width: 96%; max-width: 1400px; margin: 20px auto; flex: 1; }

        header {
            display: flex; justify-content: space-between; align-items: center; padding: 20px;
            background: var(--glass-bg); backdrop-filter: blur(10px); border-radius: 20px;
            border: 1px solid var(--glass-border); margin-bottom: 25px;
        }
        .logo { font-size: 26px; font-weight: 900; color: var(--primary-gold); }

        .toolbar { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .btn { padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; color: #fff; font-size: 13px; display: flex; align-items: center; gap: 5px; transition: 0.3s; }
        .btn-add { background: var(--success); } .btn-archive { background: var(--accent); } .btn-user { background: var(--primary-gold); color: #000; }
        .btn-lock { background: #64748b; }
        .btn-wa { background: var(--whatsapp); padding: 5px 10px !important; border-radius: 6px; }

        .table-wrapper { background: var(--glass-bg); border-radius: 20px; border: 1px solid var(--glass-border); overflow-x: auto; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; min-width: 1150px; }
        th { padding: 15px; color: var(--primary-gold); border-bottom: 1px solid var(--glass-border); font-size: 14px; }
        td { padding: 10px; border-bottom: 1px solid var(--glass-border); text-align: center; }
        
        .table-input { background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 8px; border-radius: 6px; color: #fff; text-align: center; width: 95%; outline: none; font-family: Arial; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .stat-card { background: var(--glass-bg); padding: 20px; border-radius: 20px; text-align: center; border: 1px solid var(--glass-border); border-top: 4px solid var(--primary-gold); }
        .stat-card span { display: block; font-size: 28px; font-weight: bold; margin-top: 10px; font-family: Arial; }

        .tab-nav { margin-bottom: 20px; display: flex; gap: 10px; }
        .t-btn { padding: 10px 25px; background: transparent; border: 1px solid var(--glass-border); border-radius: 10px; color: #94a3b8; cursor: pointer; }
        .t-btn.active { background: var(--primary-gold); color: #000; font-weight: bold; }

        footer { padding: 40px 20px; text-align: center; margin-top: auto; }
        .dev-container { display: inline-block; padding: 12px 30px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--primary-gold); border-radius: 50px; }
        .dev-name { color: var(--primary-gold); font-weight: 900; font-size: 18px; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h1>SalesLog</h1>
        <p style="color:var(--primary-gold)">Philo fries</p>
        <input type="password" id="passInput" placeholder="Password">
        <button class="btn btn-user" onclick="checkPass()" style="width:100%; justify-content: center;">دخول</button>
    </div>
</div>

<div id="verifyOverlay">
    <div class="verify-card">
        <h3 style="color:var(--accent); margin-top:0;">إذن التعديل</h3>
        <input type="password" id="actionPassInp" placeholder="أدخل الرقم السري" style="width: 100%; padding: 10px; margin-bottom: 15px; text-align: center; border-radius: 10px; border: 1px solid #444; background: #000; color: #fff;">
        <div style="display:flex; gap:10px;">
            <button class="btn btn-add" onclick="confirmUnlock()" style="flex:1; justify-content:center">فتح</button>
            <button class="btn" onclick="closeVerify()" style="flex:1; justify-content:center; background:#444">إلغاء</button>
        </div>
    </div>
</div>

<div id="mainContent">
    <header>
        <div class="logo">Philo fries 🍟</div>
        <div id="liveClock" style="font-family: monospace; color: var(--primary-gold); font-weight:bold;">00:00:00</div>
        <div class="no-print">
            <button class="btn btn-lock" id="lockBtn" onclick="openVerify()">🔒 فتح وضع التعديل</button>
            <button class="btn btn-lock" style="margin-top:5px; font-size:10px;" onclick="document.getElementById('bgInp').click()">🖼 الخلفية</button>
            <input type="file" id="bgInp" hidden accept="image/*" onchange="changeBg(this)">
        </div>
    </header>

    <div class="toolbar no-print">
        <button class="btn btn-add" onclick="addNewOrder()">➕ إضافة عميل</button>
        <button class="btn btn-archive" onclick="archiveToday()">📦 تقفيل اليوم</button>
        <button class="btn btn-user" onclick="doPrint('customer')">📄 فاتورة عميل</button>
        <button class="btn btn-user" style="background:#475569" onclick="doPrint('user')">📊 تقرير إدارة</button>
    </div>

    <div class="tab-nav no-print">
        <button class="t-btn active" id="tab-today" onclick="showTab('today')">مبيعات اليوم</button>
        <button class="t-btn" id="tab-history" onclick="showTab('history'); loadHistoryList()">الأرشيف</button>
        <button class="t-btn" id="tab-master" onclick="showTab('master'); loadMasterLog()">السجل الشامل</button>
    </div>

    <div id="todaySection" class="tab-section" style="display:block">
        <div style="margin-bottom: 15px;">
            💰 تكلفة الوحدة: <input type="number" id="costPerUnit" class="table-input" style="width: 100px;" placeholder="0" oninput="updateCost(this.value)">
        </div>
        <div class="table-wrapper">
            <table id="salesTable">
                <thead>
                    <tr><th>الوقت</th><th>اسم العميل</th><th>رقم الموبايل</th><th>نوع المنتج</th><th>الكمية</th><th>سعر البيع</th><th>الإجمالي</th><th>المكسب</th><th class="no-print">إجراء</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><h4>الكمية</h4><span id="totalQty">0</span></div>
            <div class="stat-card"><h4>المبيعات</h4><span id="totalRev">0</span></div>
            <div class="stat-card"><h4>الربح</h4><span id="totalProf">0</span></div>
        </div>
    </div>

    <div id="historySection" class="tab-section" style="display:none"><div id="historyList"></div></div>
    <div id="masterSection" class="tab-section" style="display:none">
        <div class="table-wrapper"><table id="masterTable"><thead><tr><th>التاريخ</th><th>العميل</th><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th>المكسب</th></tr></thead><tbody id="masterBody"></tbody></table></div>
    </div>
</div>

<footer class="no-print">
    <div class="dev-container">
        <span class="dev-name">elgokar | 01126511633</span>
    </div>
</footer>

<script>
    // --- ربط فايربيز ---
    const firebaseConfig = {
        apiKey: "AIzaSyAHoQSf3qtH_DaQIRVgvu3rKJr fBB24P38",
        authDomain: "sales-log-41275.firebaseapp.com",
        databaseURL: "https://sales-log-41275-default-rtdb.firebaseio.com",
        projectId: "sales-log-41275",
        storageBucket: "sales-log-41275.firebasestorage.app",
        messagingSenderId: "88781897193",
        appId: "1:88781897193:web:0abd3be343074cea38df78"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let isAdmin = false; let isTyping = false; let archID = null;

    function checkPass() {
        if(document.getElementById("passInput").value === "25446" || sessionStorage.getItem("logged") === "true") {
            document.getElementById("loginOverlay").style.display = "none";
            document.getElementById("mainContent").style.display = "block";
            sessionStorage.setItem("logged", "true");
            startSync();
        } else { alert("خطأ!"); }
    }
    if(sessionStorage.getItem("logged") === "true") checkPass();

    function openVerify() { document.getElementById("verifyOverlay").style.display = "flex"; }
    function closeVerify() { document.getElementById("verifyOverlay").style.display = "none"; }
    function confirmUnlock() {
        let p = document.getElementById("actionPassInp").value;
        if(p === "254468300") {
            isAdmin = true;
            document.getElementById("lockBtn").innerText = "🔓 وضع التعديل مفتوح";
            document.getElementById("lockBtn").style.background = "var(--success)";
            closeVerify();
            startSync();
        } else { alert("باسوورد التعديل خطأ!"); }
    }

    function startSync() {
        db.ref('currentDay').on('value', (snap) => {
            if(isTyping) return;
            const data = snap.val() || { cost:0, sales:[] };
            document.getElementById("costPerUnit").value = data.cost || "";
            renderTable(data.sales || []);
        });
        let savedBg = localStorage.getItem("royal_bg");
        if(savedBg) document.body.style.backgroundImage = `url(${savedBg})`;
    }

    function renderTable(sales) {
        const tbody = document.querySelector("#salesTable tbody");
        tbody.innerHTML = "";
        let tQ=0, tR=0, tP=0;
        let cost = parseFloat(document.getElementById("costPerUnit").value) || 0;

        sales.forEach((s, i) => {
            let q = parseFloat(s.qty) || 0; let p = parseFloat(s.price) || 0;
            let rt = q * p; let rp = (p - cost) * q;
            tQ += q; tR += rt; tP += rp;
            let row = tbody.insertRow();
            row.innerHTML = `
                <td><input class="table-input" value="${s.time}" readonly style="border:none; width:70px"></td>
                <td><input class="table-input" value="${s.name||''}" placeholder="..." ${!isAdmin?'readonly':''} onfocus="isTyping=true" onblur="isTyping=false" oninput="updateSale(${i},'name',this.value)"></td>
                <td><input class="table-input" value="${s.phone||''}" placeholder="01..." ${!isAdmin?'readonly':''} onfocus="isTyping=true" onblur="isTyping=false" oninput="updateSale(${i},'phone',this.value)"></td>
                <td><input class="table-input" value="${s.product||''}" placeholder="..." ${!isAdmin?'readonly':''} onfocus="isTyping=true" onblur="isTyping=false" oninput="updateSale(${i},'product',this.value)"></td>
                <td><input class="table-input" type="number" value="${s.qty||''}" placeholder="0" ${!isAdmin?'readonly':''} onfocus="isTyping=true" onblur="isTyping=false" oninput="updateSale(${i},'qty',this.value)"></td>
                <td><input class="table-input" type="number" value="${s.price||''}" placeholder="0" ${!isAdmin?'readonly':''} onfocus="isTyping=true" onblur="isTyping=false" oninput="updateSale(${i},'price',this.value)"></td>
                <td style="color:var(--primary-gold); font-weight:bold;">${rt.toLocaleString()}</td>
                <td style="color:var(--success); font-weight:bold;">${rp.toLocaleString()}</td>
                <td class="no-print">
                    <button class="btn btn-wa" onclick="sendWA(${i})">💬</button>
                    <button class="btn" style="padding:5px; background:var(--danger);" onclick="deleteSale(${i})">❌</button>
                </td>
            `;
        });
        document.getElementById("totalQty").innerText = tQ;
        document.getElementById("totalRev").innerText = tR.toLocaleString();
        document.getElementById("totalProf").innerText = tP.toLocaleString();
    }

    function sendWA(i) {
        db.ref(archID ? `history/${archID}/sales/${i}` : `currentDay/sales/${i}`).once('value', (snap) => {
            const s = snap.val();
            if(!s.phone) return alert("أدخل رقم العميل أولاً");
            const total = (parseFloat(s.qty) * parseFloat(s.price)).toLocaleString();
            const msg = `🍟 *فاتورة مبيعات من Philo fries* 🍟%0A------------------------------------%0A👤 *العميل:* ${s.name}%0A🍟 *نوع المنتج:* ${s.product}%0A🔢 *الكمية:* ${s.qty}%0A💰 *السعر:* ${s.price} EGP%0A💵 *الإجمالي:* ${total} EGP%0A------------------------------------%0A✨ *جودة نثق بها.. وطعم يعشقه الجميع* %0A📍 *Philo fries ترحب بكم* %0A📲 *للتواصل:* wa.me/201126511633`;
            window.open(`https://wa.me/20${s.phone}?text=${msg}`, '_blank');
        });
    }

    function updateSale(i, f, v) { if(!isAdmin) return; let ref = archID ? `history/${archID}/sales/${i}` : `currentDay/sales/${i}`; db.ref(ref).child(f).set(v); }
    function updateCost(v) { if(!isAdmin) return; let ref = archID ? `history/${archID}/cost` : `currentDay/cost`; db.ref(ref).set(v); }
    function addNewOrder() { if(!isAdmin) return alert("افتح التعديل"); let ref = archID ? `history/${archID}/sales` : `currentDay/sales`; db.ref(ref).once('value', (snap) => { let s = snap.val() || []; s.push({time: new Date().toLocaleTimeString('en-US',{hour12:false, hour:'2-digit', minute:'2-digit'}), name:"", phone:"", product:"", qty:"", price:""}); db.ref(ref).set(s); }); }
    function deleteSale(i) { if(!isAdmin) return alert("افتح التعديل"); if(confirm("مسح؟")) { isTyping = false; db.ref(archID ? `history/${archID}/sales` : 'currentDay/sales').once('value', (snap) => { let s = snap.val(); s.splice(i, 1); db.ref(archID ? `history/${archID}/sales` : 'currentDay/sales').set(s); }); } }

    function archiveToday() {
        if(!isAdmin) return alert("افتح التعديل");
        if(!confirm("ترحيل؟")) return;
        db.ref('currentDay').once('value', (snap) => {
            const d = snap.val();
            db.ref('history').push({ date: new Date().toLocaleString('ar-EG'), cost: d.cost, sales: d.sales });
            db.ref('currentDay/sales').set([]);
            alert("تم الترحيل");
        });
    }

    function loadHistoryList() { db.ref('history').on('value', (snap) => { const list = document.getElementById("historyList"); list.innerHTML = ""; const d = snap.val(); if(!d) return; Object.keys(d).reverse().forEach(id => { let div = document.createElement("div"); div.style = "background:var(--glass-bg); padding:15px; border-radius:15px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border:1px solid var(--glass-border);"; div.innerHTML = `<strong>🗓️ ${d[id].date}</strong> <div><button class="btn btn-user" onclick="viewHist('${id}')">فتح اليوم</button></div>`; list.appendChild(div); }); }); }
    function viewHist(id) { archID = id; db.ref(`history/${id}`).on('value', (snap) => { const e = snap.val(); if(!e) return; document.getElementById("costPerUnit").value = e.cost; renderTable(e.sales || []); showTab('today'); }); }

    function loadMasterLog() { const b = document.getElementById("masterBody"); b.innerHTML = ""; db.ref().once('value', (snap) => { const a = snap.val(); if(!a || !a.history) return; Object.values(a.history).reverse().forEach(h => { if(h.sales) h.sales.forEach(s => { let row = b.insertRow(); row.innerHTML = `<td>${h.date}</td><td>${s.name}</td><td>${s.product||'-'}</td><td>${s.qty}</td><td>${s.price}</td><td>${(s.qty*s.price).toLocaleString()}</td><td>${((s.price-h.cost)*s.qty).toLocaleString()}</td>`; }); }); }); }

    function showTab(t) { if(t !== 'today') archID = null; document.querySelectorAll('.tab-section').forEach(s => s.style.display = 'none'); document.getElementById(t + 'Section').style.display = 'block'; document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('active')); document.getElementById('tab-' + t).classList.add('active'); }

    // --- وظيفة الطباعة الملكية المحدثة بالـ QR Code ---
    function doPrint(m) {
        let rows = document.querySelectorAll("#salesTable tbody tr");
        let win = window.open('', '', 'height=700,width=1000');
        let html = `<html><head><style>body{direction:rtl; font-family:sans-serif; padding:40px; background:#fff; color:#000; text-align:center;} table{width:80%; margin: 20px auto; border-collapse:collapse;} th,td{border:1px solid #000; padding:12px; text-align:center;} th{background:#f9f9f9;} .qr-container{margin-top:40px;} .footer-text{color:#1e90ff; font-weight:bold; margin-top:15px;}</style></head><body>`;
        html += `<h2>فاتورة مبيعات من Philo fries 🍟</h2>`;
        html += `<table><thead><tr><th>العميل</th><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th>`;
        if(m==='user') html += `<th>المكسب</th>`;
        html += `</tr></thead><tbody>`;
        rows.forEach(r => {
            let n=r.cells[1].querySelector('input').value; let pr=r.cells[3].querySelector('input').value; let q=r.cells[4].querySelector('input').value; let p=r.cells[5].querySelector('input').value;
            if(n||q){ html+=`<tr><td>${n}</td><td>${pr}</td><td>${q}</td><td>${p}</td><td>${r.cells[6].innerText}</td>`; if(m==='user') html+=`<td>${r.cells[7].innerText}</td>`; html+=`</tr>`;}
        });
        html += `</tbody></table>`;
        
        // إضافة الـ QR Code والرسالة الختامية
        html += `<div class="qr-container">`;
        html += `<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://wa.me/201126511633" alt="QR Code">`;
        html += `<p class="footer-text">Philo fries | جودة نثق بها، طعم يعشقه الجميع ✨</p>`;
        html += `</div>`;
        
        html += `<p style="margin-top:30px; font-size:12px; opacity:0.6;">المطور elgokar</p></body></html>`;
        win.document.write(html); win.document.close(); setTimeout(()=>win.print(), 500);
    }

    function changeBg(input) { if (input.files && input.files[0]) { let reader = new FileReader(); reader.onload = (e) => { document.body.style.backgroundImage = `url(${e.target.result})`; localStorage.setItem("royal_bg", e.target.result); }; reader.readAsDataURL(input.files[0]); } }
    setInterval(()=> { document.getElementById('liveClock').innerText = new Date().toLocaleTimeString(); }, 1000);
    document.getElementById("passInput").addEventListener("keypress", (e) => { if(e.key === "Enter") checkPass(); });
</script>
</body>
</html>
